<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #10B981; } a:hover { color: #34D399; }
  </style>
</helmet>

<div style="width:1280px;height:720px;position:relative;overflow:hidden;background:#0F172A;font-family:'Manrope','Segoe UI',system-ui,sans-serif;color:#F8FAFC;">

  <svg width="1280" height="720" viewBox="0 0 1280 720" style="position:absolute;inset:0;">
    <defs>
      <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
        <path d="M48 0H0V48" fill="none" stroke="#1E293B" stroke-width="1"/>
      </pattern>
      <radialGradient id="glow" cx="74%" cy="40%" r="46%">
        <stop offset="0%" stop-color="#312E81" stop-opacity="0.62"/>
        <stop offset="100%" stop-color="#312E81" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect width="1280" height="720" fill="url(#grid)" opacity="0.6"/>
    <rect width="1280" height="720" fill="url(#glow)"/>
  </svg>

  <!-- wordmark -->
  <div style="position:absolute;top:56px;left:64px;display:flex;align-items:center;gap:12px;">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <rect width="24" height="24" rx="7" fill="#312E81"/>
      <circle cx="8" cy="15.5" r="2.1" fill="#10B981"/>
      <circle cx="16" cy="8.5" r="2.1" fill="#F8FAFC"/>
      <circle cx="16.5" cy="16" r="1.6" fill="#818CF8"/>
      <path d="M8 15.5L16 8.5M16 8.5L16.5 16" stroke="#10B981" stroke-width="1.4"/>
    </svg>
    <span style="font-weight:700;font-size:16px;letter-spacing:-0.01em;">Inventra AI</span>
  </div>

  <!-- text block -->
  <div style="position:absolute;left:64px;top:214px;max-width:640px;">
    <div style="font-size:12px;font-weight:700;letter-spacing:0.22em;color:#34D399;text-transform:uppercase;">Startup Concept Document</div>
    <h1 style="font-family:'Space Grotesk','Segoe UI',sans-serif;font-weight:700;font-size:92px;line-height:0.98;margin:20px 0 0;letter-spacing:-0.03em;">Inventra AI</h1>
    <p style="font-size:29px;line-height:1.32;font-weight:500;color:#CBD5E1;margin:22px 0 0;max-width:560px;">The AI Operating Copilot for Cambodian SMEs</p>
    <div style="display:flex;align-items:flex-start;gap:16px;margin-top:40px;max-width:540px;">
      <div style="width:3px;align-self:stretch;background:#10B981;border-radius:2px;flex:none;"></div>
      <p style="font-size:18px;line-height:1.5;font-weight:500;color:#E2E8F0;margin:0;font-style:italic;">Helping SMEs make smarter business decisions, not just manage inventory.</p>
    </div>
  </div>

  <!-- AI copilot illustration -->
  <div style="position:absolute;right:74px;top:132px;width:470px;height:470px;">
    <svg width="470" height="470" viewBox="0 0 470 470" fill="none">
      <circle cx="235" cy="235" r="222" stroke="#1E293B" stroke-width="1.5"/>
      <circle cx="235" cy="235" r="158" stroke="#4338CA" stroke-width="1.4" stroke-dasharray="2 7"/>
      <circle cx="235" cy="235" r="96" stroke="#334155" stroke-width="1.4"/>
      <g stroke="#10B981" stroke-width="1.5" opacity="0.65">
        <line x1="235" y1="235" x2="235" y2="77"/>
        <line x1="235" y1="235" x2="393" y2="235"/>
        <line x1="235" y1="235" x2="118" y2="326"/>
        <line x1="235" y1="235" x2="342" y2="360"/>
      </g>
      <circle cx="235" cy="77" r="27" fill="#312E81" stroke="#6366F1" stroke-width="1.5"/>
      <circle cx="393" cy="235" r="24" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <circle cx="118" cy="326" r="22" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <circle cx="342" cy="360" r="20" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <!-- node glyphs -->
      <path d="M226 80l6-7 6 7 6-6" stroke="#34D399" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M385 235h16M389 231v8M395 229v12M401 233v4" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <path d="M110 326h16M118 318v16" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="342" cy="360" r="5" stroke="#94A3B8" stroke-width="2"/>
      <!-- core -->
      <rect x="189" y="189" width="92" height="92" rx="24" fill="#10B981"/>
      <path d="M214 236l14 14 30-34" stroke="#0F172A" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="position:absolute;left:198px;top:16px;font-size:11px;font-weight:600;color:#94A3B8;">FORECAST</div>
    <div style="position:absolute;right:-6px;top:216px;font-size:11px;font-weight:600;color:#94A3B8;">CASH FLOW</div>
    <div style="position:absolute;left:52px;top:352px;font-size:11px;font-weight:600;color:#94A3B8;">DEAD STOCK</div>
    <div style="position:absolute;left:300px;top:388px;font-size:11px;font-weight:600;color:#94A3B8;">RISK</div>
  </div>

  <!-- footer -->
  <div style="position:absolute;bottom:44px;left:64px;right:64px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:500;color:#64748B;">
    <span>Prepared for the AIM Competition &middot; August 2026</span>
    <span style="letter-spacing:0.14em;text-transform:uppercase;">Confidential</span>
  </div>

</div>
</x-dc>
</body>
</html>
