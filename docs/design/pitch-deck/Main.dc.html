<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <style>
    *{box-sizing:border-box;}
    body{margin:0;font-family:'Geist',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#FFFFFF;color:#111827;-webkit-font-smoothing:antialiased;}
    a{color:#0F766E;} a:hover{color:#115E59;}
    .slide{width:1280px;height:720px;padding:72px 80px;display:flex;align-items:center;gap:56px;position:relative;overflow:hidden;background:#FFFFFF;}
    .edge{position:absolute;left:0;top:0;bottom:0;width:6px;background:#0F766E;}
    .left{width:560px;display:flex;flex-direction:column;}
    .wordmark{display:flex;align-items:center;gap:12px;margin-bottom:40px;}
    .mark{width:40px;height:40px;border:2px solid #0F766E;border-radius:11px;display:flex;align-items:center;justify-content:center;}
    .wordmark span{font-size:19px;font-weight:600;letter-spacing:-0.01em;color:#111827;}
    h1{margin:0;font-size:52px;line-height:1.08;font-weight:600;letter-spacing:-0.025em;color:#111827;}
    h1 em{font-style:normal;color:#0F766E;}
    .sub{margin:24px 0 0;font-size:19px;line-height:1.5;font-weight:400;color:#4B5563;max-width:480px;}
    .tag{margin:28px 0 0;display:inline-flex;align-items:center;gap:10px;padding:9px 16px;border:1px solid #CCFBF1;background:#F0FDFA;border-radius:999px;font-size:13.5px;font-weight:500;color:#0F766E;align-self:flex-start;}
    .presenter{margin-top:52px;}
    .presenter .k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#0F766E;margin:0 0 6px;}
    .presenter .n{font-size:16px;font-weight:500;color:#374151;}
    .right{flex:1;display:flex;justify-content:center;align-items:center;}
    .footer{position:absolute;left:80px;right:80px;bottom:34px;display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#9CA3AF;}
    .footer .brand{font-weight:600;color:#6B7280;}
  </style>
</helmet>
<div class="slide">
  <div class="edge"></div>

  <div class="left">
    <div class="wordmark">
      <div class="mark">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 4 7v10l8 4 8-4V7Z"/><path d="m4 7 8 4 8-4"/><path d="M12 11v10"/>
        </svg>
      </div>
      <span>Inventra AI</span>
    </div>

    <h1>AI Copilot for <em>Smarter</em> Inventory Decisions</h1>
    <p class="sub">Upload a spreadsheet. Get AI&#8209;powered business decisions.</p>

    <div class="tag">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v13"/>
      </svg>
      Spreadsheet in &rarr; decisions out
    </div>

    <div class="presenter">
      <p class="k">Presented by</p>
      <div class="n">[Your Name]</div>
    </div>
  </div>

      <rect x="418" y="166" width="30" height="76" rx="4" fill="#14B8A6"/>

      <rect x="48" y="292" width="26" height="26" rx="7" stroke="#E5E7EB" stroke-width="2"/>
      <rect x="88" y="298" width="150" height="7" rx="3.5" fill="#E5E7EB"/>
      <rect x="88" y="310" width="92" height="6" rx="3" fill="#F1F5F9"/>
      <circle cx="442" cy="305" r="5" fill="#F59E0B"/>

      <rect x="48" y="332" width="26" height="26" rx="7" stroke="#E5E7EB" stroke-width="2"/>
      <rect x="88" y="338" width="128" height="7" rx="3.5" fill="#E5E7EB"/>
      <rect x="88" y="350" width="104" height="6" rx="3" fill="#F1F5F9"/>
      <circle cx="442" cy="345" r="5" fill="#22C55E"/>

      <rect x="250" y="332" width="250" height="98" rx="14" fill="#111827"/>
      <circle cx="282" cy="368" r="12" stroke="#5EEAD4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="m276.5 368 4 4 7-8" stroke="#5EEAD4" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="306" y="360" font-family="Geist, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Recommended action</text>
      <text x="306" y="381" font-family="Geist, sans-serif" font-size="13" font-weight="500" fill="#5EEAD4">Reorder within 3 days</text>
      <rect x="306" y="394" width="132" height="20" rx="10" fill="#7F1D1D"/>

    </svg>
  </div>

  <div class="footer">
    <span class="brand">Inventra AI</span>
    <span>AIM Build Week 2026</span>
  </div>
</div>
</x-dc>
</body>
</html>
